<svg xmlns="http://www.w3.org/2000/svg" width="988" height="290" viewBox="0 0 988 290" role="img" aria-label="Rotary inverted pendulum control loop">
<title>Rotary inverted pendulum control loop</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C9A860"/></marker></defs>
<rect width="988" height="290" rx="14" fill="#0E1626"/>
<text x="28" y="38" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#EADBB0">In the Balance: rotary inverted pendulum control loop</text><rect x="28" y="70" width="170" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="113.0" y="96.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Setpoint</text><text x="113.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">pendulum upright</text><rect x="252" y="70" width="200" height="64" rx="8" fill="#16213A" stroke="#79C8EE" stroke-width="1.5"/><text x="352.0" y="96.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Jetson Orin Nano</text><text x="352.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">PID loop on Linux</text><rect x="546" y="70" width="170" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="631.0" y="107.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Motor driver</text><rect x="790" y="70" width="170" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="875.0" y="96.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Motor + arm</text><text x="875.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">spins the arm</text><rect x="790" y="172" width="170" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="875.0" y="198.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Pendulum</text><text x="875.0" y="218.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">on the arm tip</text><rect x="252" y="172" width="200" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="352.0" y="198.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Angle sensors</text><text x="352.0" y="218.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">pendulum + arm</text><line x1="198" y1="102" x2="252" y2="102" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><text x="225.0" y="94.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#79C8EE">error</text><line x1="452" y1="102" x2="546" y2="102" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><text x="499.0" y="94.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#79C8EE">command</text><line x1="716" y1="102" x2="790" y2="102" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><line x1="875" y1="134" x2="875" y2="172" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><line x1="790" y1="204" x2="452" y2="204" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><text x="621.0" y="196.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#79C8EE">angles</text><path d="M352 172 L352 134" fill="none" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><text x="28" y="270" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9AA6BA">Hardware (motor, sensors, rotary vs. cart) is being decided by team vote.</text>
</svg>
